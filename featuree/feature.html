<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">

<body>

    <header>
        <h1>Feature</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="tour.html">Tour Packages</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>
        <p>Have any questions about our tour packages? Feel free to contact us.</p>

        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" placeholder="Enter your message"></textarea>
            <br><br>

            <button type="submit">Send Message</button>
        </form>

        <h3>Contact Information</h3>
        <p><strong>Phone:</strong> +91 98765 43210</p>
        <p><strong>Email:</strong> info@tourpackage.com</p>
        <p><strong>Address:</strong> Nagercoil, Tamil Nadu, India</p>
    </main>

    <footer>
        <p>&copy; 2026 Tour Package. All Rights Reserved.</p>
    </footer>

</body>
</html>
